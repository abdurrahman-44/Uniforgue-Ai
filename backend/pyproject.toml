[project]
name = "uniforge-ai-backend"
version = "1.0.0"
description = "UNIFORGE AI — Academic Productivity & Creation Ecosystem Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    "pymupdf>=1.24.14",
    "python-docx>=1.1.2",
    "reportlab>=4.2.5",
    "python-pptx>=1.0.2",
    "pillow>=11.0.0",
    "markdown>=3.7",
    "bleach>=6.2.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "boto3>=1.35.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]
